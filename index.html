<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaga Garagem — Valor da Vaga | Praia Digital</title><meta name="description" content="Quanto uma vaga de garagem agrega ao preço de venda e à diária de temporada no litoral."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#eceff7,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #34507a22}h1{color:#27436b;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #d6ddea;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#34507a;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#edf1f8;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#34507a;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/avaliador-imoveis">Avaliador de Imóveis</a> · <a href="https://praia.digital/preco-justo">Preço Justo</a> · <a href="https://praia.digital/transito-litoral">Trânsito Litoral</a></nav><div class="card"><h1>🚗 Vaga Garagem</h1><p>No litoral, quem vem de carro paga mais. Quanto vale a sua vaga?</p><label>Cidade</label><select id="c"><option value="0.10">Santos (centro/Gonzaga)</option><option value="0.08" selected>Guarujá</option><option value="0.07">Praia Grande / São Vicente</option><option value="0.06">Litoral Norte (Ubatuba, Caraguá, São Sebá)</option></select><label>Valor do imóvel sem vaga (R$)</label><input id="v" type="number" value="450000"><label>Número de vagas</label><select id="n"><option value="1" selected>1 vaga</option><option value="2">2 vagas</option><option value="3">3+ vagas</option></select><label>Diária atual sem vaga (R$)</label><input id="d" type="number" value="400"><button onclick="calc()">Calcular valor da vaga</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const c=g('c'),v=g('v'),n=g('n'),d=g('d');const fator=[0,1,1.7,2.2][n],agrega=v*c*fator,diaria=d*(0.07+0.03*(n-1));document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>🏷️ Agregação ao valor de venda: <b>+R$ ${agrega.toFixed(0)}</b> (${(c*fator*100).toFixed(0)}%)</p><p>🌙 Potencial de aumento na diária: <b>+R$ ${diaria.toFixed(0)}/noite</b></p><p>📅 Em 10 diárias/mês, a vaga rende <b>R$ ${(diaria*10).toFixed(0)} a mais por mês</b> — payback simbólico em ${(agrega/(diaria*10)/12).toFixed(1)} anos de venda... ou fique com o imóvel e lucre na temporada.</p><p>💡 Recalcule o valor total do imóvel no <a href="https://praia.digital/avaliador-imoveis">Avaliador de Imóveis</a>.</p>`}</script></body></html>
